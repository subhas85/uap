# UAP drop-in: run xrdp in the foreground so systemd tracks it correctly.
#
# The packaged unit is Type=forking with PIDFile=/run/xrdp/xrdp.pid. On Ubuntu
# 24.04 systemd polls for that file before xrdp has written it and logs:
#
#   xrdp.service: Can't open PID file /run/xrdp/xrdp.pid (yet?) after start:
#   No such file or directory
#
# The daemon then runs and serves 3389 perfectly well, but systemd never adopts
# the main PID: ActiveState stays `activating`, ExecMainPID=0, and the unit sits
# there until TimeoutStartSec elapses. Anything that keys off `systemctl
# is-active xrdp` — the watchdog, monitoring, a later apply.sh run — sees a
# service that looks broken while working fine.
#
# Fix: xrdp -n/--nodaemon keeps it in the foreground, so Type=simple lets systemd
# own the process directly and no PID file is involved. ExecStop is cleared too:
# the packaged one calls `xrdp --kill`, which reads the PID file that no longer
# exists. systemd's default SIGTERM to the main process is correct here.

[Service]
Type=simple
PIDFile=
ExecStart=
ExecStart=/usr/sbin/xrdp --nodaemon $XRDP_OPTIONS
ExecStop=
