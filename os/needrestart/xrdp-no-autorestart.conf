# UAP — do NOT auto-restart xrdp on library upgrades.
# xrdp-sesman keeps its RDP session registry in memory only; an automatic
# restart (unattended-upgrades via needrestart) wipes it and orphans the live
# desktop — you reconnect to a blank NEW session instead of your work
# (hit 2026-06-03, triggered by a liblzma5/xz-utils security patch). Libs still
# get patched; restart xrdp yourself when ready.
$nrconf{override_rc}{qr(^xrdp(-sesman)?\.service$)} = 0;
