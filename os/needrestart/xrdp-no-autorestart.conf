# UAP — do NOT auto-restart xrdp on library upgrades.
# xrdp-sesman keeps its RDP session registry in memory only; an automatic
# restart (unattended-upgrades via needrestart) wipes it and orphans the live
# desktop — you reconnect to a blank NEW session instead of your work
# (hit 2026-06-03, triggered by a liblzma5/xz-utils security patch). Libs still
# get patched; restart xrdp yourself when ready.
#
# CRITICAL: needrestart matches override_rc against the BARE unit name ("xrdp",
# "xrdp-sesman") with NO ".service" suffix — see `needrestart -r l -b` output
# `NEEDRESTART-SVC: xrdp`, and apply.sh's source loop (it appends ".service" when
# building the `systemctl restart` command, so $rc is bare in the match). A
# `\.service$`-anchored regex NEVER matches and is SILENTLY DEAD — that bug left
# this override ineffective May–Jun 2026 and xrdp kept getting restarted (verified
# 2026-06-26: a kpartx/chrome upgrade ran `systemctl restart ... xrdp.service`).
# Match bare name + optional .service so it works regardless.
$nrconf{override_rc}->{qr(^xrdp(-sesman)?(\.service)?$)} = 0;
